name: DockTamer
options:
  bundleIdPrefix: com.docktamer
targets:
  DockTamer:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources: 
      - DockTamer/Sources
      - DockTamer/Assets.xcassets
      - DockTamer/en.lproj
      - DockTamer/zh-Hant.lproj
    settings:
      GENERATE_INFOPLIST_FILE: YES
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      INFOPLIST_KEY_LSUIElement: YES
      # NSAccessibilityUsageDescription is now localized via InfoPlist.strings in en.lproj and zh-Hant.lproj
      # Standard properties for macOS apps that Xcode implicitly adds
      INFOPLIST_KEY_CFBundleShortVersionString: "1.0"
      INFOPLIST_KEY_CFBundleVersion: "1"
      INFOPLIST_KEY_NSPrincipalClass: "NSApplication"
